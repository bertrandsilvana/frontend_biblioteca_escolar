<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Biblioteca Escolar</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>

        <h1>
            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSegLD51tXxJO9KrpV6R1yguqZPp7y3EggqEvN7Rbc9Hw&s=10"
                alt="Biblioteca"
                width="60"
            >
            Biblioteca Escolar
        </h1>

        <p>Acceso al sistema</p>

    </header>


    <main>

        <section>

            <h2>
                Iniciar sesión
            </h2>

            <form id="formLogin">

                <label for="email">
                    Email:
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >

                <br><br>

                <label for="password">
                    Contraseña:
                </label>

                <input
                    type="password"
                    id="password"
                    required
                >

                <br><br>

                <button type="submit">
                    Ingresar
                </button>

            </form>

            <p id="mensaje"></p>

        </section>

    </main>


    <script src="login.js"></script>

</body>

</html>
